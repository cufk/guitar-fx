# Bygger och testar Stagebox. iPad-versionen byggs alltid (plus skärmdumpar i simulatorn).
# På main (och vid taggar v*) byggs även Stagebox.app och en
# .dmg på en Mac, som laddas upp som artefakt (Actions → körningen → Artifacts).
name: Bygg

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: Tester (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Bygg kärnan och kör tester
        run: |
          cmake -B build-core -DGFX_BUILD_APP=OFF -DCMAKE_BUILD_TYPE=Release
          cmake --build build-core -j
          ctest --test-dir build-core --output-on-failure

  mac:
    name: Stagebox.app och .dmg (macOS)
    runs-on: macos-latest   # aktuell Mac-maskin hos GitHub (äldre versioner fasas ut)
    needs: tests
    if: github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - name: Bygg, testa och paketera
        run: ./scripts/build-mac.sh
      - name: Ladda upp .dmg
        uses: actions/upload-artifact@v4
        with:
          name: Stagebox-dmg
          path: dist/*.dmg
          if-no-files-found: error

  ipad:
    name: iPad (bygge + skärmdumpar i simulatorn)
    runs-on: macos-latest
    needs: tests
    steps:
      - uses: actions/checkout@v4
      - name: Bygg för iPad (osignerat – kontrollerar att allt kompilerar för riktig iPad)
        run: |
          cmake -B build-ios -G Xcode -DCMAKE_SYSTEM_NAME=iOS -DCMAKE_OSX_DEPLOYMENT_TARGET=16.0
          xcodebuild -project build-ios/Stagebox.xcodeproj -scheme Stagebox_Standalone -configuration Release \
                     -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO -quiet build
      - name: Simulator och skärmdumpar
        run: ./scripts/ipad-screenshots.sh
      - name: Ladda upp skärmdumpar
        uses: actions/upload-artifact@v4
        with:
          name: Stagebox-ipad-skarmdumpar
          path: screenshots/*.png
          if-no-files-found: warn
